# CI do A.R.I.S — roda as duas suítes (raiz + aris_eyes).
#
# Deselects justificados (falhas conhecidas, ver relatório da Parte 4):
# - test_conversation_returns_none: DECISÃO DO USUÁRIO manter a resposta
#   local rápida no NLU fast-path (o teste espera o comportamento antigo
#   de repasse ao LLM) — não é regressão.
# - test_gmail (3): falha pré-existente — o fixture do teste não liga o
#   SafetyManager no GmailService, então os tokens nunca são gravados e
#   load_secret devolve None (corrigir é decisão do usuário).
name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  raiz:
    name: Suíte raiz
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # Headless: sem placa de som, o pygame.mixer.init() trava na
      # enumeração ALSA SEGURANDO a GIL (freeze de 38 min medido no CI —
      # ver utils/voice_hybrid._garantir_driver_audio_headless). O driver
      # dummy do SDL inicializa na hora e não muda resultado de teste
      # algum (mixer.get_init() continua verdadeiro).
      SDL_AUDIODRIVER: dummy
      # Saída linha a linha: sem isso o stdout block-buffered esconde
      # onde a suíte travou (perdido no SIGKILL do cancelamento).
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # espeak-ng: voz de fallback offline da Áris — os testes de voz
      # (pitch feminino pt-br+f3) rodam o binário de verdade.
      - name: Pacotes do sistema (pyaudio/PortAudio + espeak-ng)
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev espeak-ng

      - name: Dependências (núcleo + opcionais)
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          # requirements-optional.txt menos openwakeword: no Linux ele
          # declara tflite-runtime, que não tem wheel p/ Python 3.12.
          grep -v "^openwakeword" requirements-optional.txt > /tmp/opcionais.txt
          pip install -r /tmp/opcionais.txt
          # openwakeword sem dependências + backend ONNX (suficiente p/ os
          # modelos .onnx, incluindo o treinado da Áris).
          pip install --no-deps openwakeword
          # Guarda diagnóstica: um teste que travar vira FALHA com nome em
          # 10 min em vez de segurar o job por horas (já houve um hang de
          # 30 min na CI; ver timeout= abaixo). Só muda o harness do CI,
          # nenhum arquivo de teste é alterado.
          pip install pytest-timeout

      # Voz piper pt-BR (TTS offline): o binário vem do piper-tts nas
      # opcionais; o modelo .onnx (~63 MB) vai em cache — sem ele a
      # descoberta do modelo falha e o synth do piper pula.
      - name: Voz piper pt-BR (modelo, com cache)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/piper/voices
          key: piper-voz-ptBR-faber-medium

      - name: Baixa modelo piper se ausente
        run: |
          mkdir -p ~/.local/share/piper/voices
          if [ ! -f ~/.local/share/piper/voices/pt_BR-faber-medium.onnx ]; then
            base=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium
            curl -fsSL -o ~/.local/share/piper/voices/pt_BR-faber-medium.onnx \
              "$base/pt_BR-faber-medium.onnx"
            curl -fsSL -o ~/.local/share/piper/voices/pt_BR-faber-medium.onnx.json \
              "$base/pt_BR-faber-medium.onnx.json"
          fi

      # python -m pytest (e não o atalho `pytest`): sem __init__.py em
      # tests/, só o modo -m põe o cwd no sys.path — é assim que a suíte
      # roda localmente e sem isso `import aris_agent/core` quebra.
      # -v: loga o NOME de cada teste na hora (sem -v os pontos do modo
      # -q não dizem onde exatamente algo travou).
      #
      # Watchdog: a suíte já travou 38 min em test_hud_chat sem que o
      # --timeout=600 (SIGALRM) disparasse — sinal de thread presa em C
      # sem devolver a GIL, que impede o handler de rodar. Se parar 15
      # min, o py-spy despeja as pilhas PYTHON e NATIVAS (ptrace, vê o
      # C mesmo com a GIL presa) e mata o processo: hang vira falha
      # visível em vez de segurar o job por horas.
      - name: Suíte raiz
        run: |
          trap 'echo "===== saída do pytest ====="; cat /tmp/pytest_ci.txt 2>/dev/null' EXIT
          python -m pytest -v --timeout=600 --tb=short -p no:cacheprovider \
            --deselect tests/test_integration_nlu.py::TestNLUFastPath::test_conversation_returns_none \
            --deselect tests/test_gmail.py::TestTokenStorage::test_store_and_load_tokens \
            --deselect tests/test_gmail.py::TestTokenStorage::test_load_stored_tokens \
            --deselect tests/test_gmail.py::TestTokenRefresh::test_refresh_on_401 \
            > /tmp/pytest_ci.txt 2>&1 &
          PID=$!
          START=$SECONDS
          while kill -0 "$PID" 2>/dev/null; do
            if [ $((SECONDS - START)) -gt 900 ]; then
              echo "::warning::SUITE TRAVOU (>15 min parada) — dump py-spy:"
              pip install -q py-spy || true
              py-spy dump --pid "$PID" --native 2>/tmp/pyspy_err.txt \
                || { echo "py-spy --native falhou:"; cat /tmp/pyspy_err.txt
                     # runner efêmero da Actions (não é a máquina do usuário):
                     sudo sysctl -w kernel.yama.ptrace_scope=0 >/dev/null 2>&1 || true
                     py-spy dump --pid "$PID" || true
                     py-spy dump --pid "$PID" --native || true; }
              kill -9 "$PID" 2>/dev/null || true
              break
            fi
            sleep 15
          done
          wait "$PID"

  olhos:
    name: Suíte aris_eyes
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 importa Gui/OpenGL mesmo offscreen (libEGL etc.).
      - name: Pacotes do sistema (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Dependências (PySide6)
        working-directory: aris_eyes
        run: |
          python -m pip install -U pip
          pip install pytest -r requirements.txt

      - name: Suíte aris_eyes
        working-directory: aris_eyes
        run: python -m pytest tests -q -p no:cacheprovider
