; PlatformIO Configuration for ARIS ESP32 (Mini Deck)
; https://docs.platformio.org/en/latest/boards/espressif32.html
;
; O firmware usa a API LEDC nova (ledcAttach/ledcWrite por pino) do
; Arduino-ESP32 3.x, que NAO existe na plataforma oficial `espressif32`
; (core 2.x). Usamos o pioarduino (Arduino core 3.x — o mesmo core que o
; Arduino IDE 3.x instala). Na primeira build o PlatformIO baixa a
; plataforma + toolchain automaticamente.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    ArduinoJson
    WebSocket

; Upload via USB
upload_speed = 921600

; Monitor
monitor_filters = esp32_exception_decoder
