; PlatformIO Configuration for ARIS ESP32
; https://docs.platformio.org/en/latest/boards/espressif32.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    ArduinoJson
    WebSocket

; Upload via USB
upload_speed = 921600

; Monitor
monitor_filters = esp32_exception_decoder
