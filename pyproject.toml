[project]
name = "aris"
version = "0.1.0"
description = "A.R.I.S. — Assistente de Raciocínio e Integração de Sistemas"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

# Sem [project.scripts]: o projeto é "flat layout" com vários pacotes de
# topo (core, utils, modules, agent, gateway...) e não é instalado via
# pip — instalar bagunçaria o site-packages. O ponto de entrada é
# `python main.py` (documentado no README).

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
